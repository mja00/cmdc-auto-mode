name: Corpus

on:
  schedule:
    # Daily at 13:00 UTC.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replay the corpus against live TypeSafe Jev
        run: npm run test:corpus
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
